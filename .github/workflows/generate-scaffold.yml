name: Generate Scaffold
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
      - name: Flutter Create & Zip
        run: |
          flutter create temp_project --org com.example --project-name anime_aggregator --platforms android
          cd temp_project
          zip -r ../android_scaffold.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: android_scaffold.zip
