name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'

      - name: Flutter pub get
        run: flutter pub get

      # 核心修复：强制重新生成骨架，并修改 minSdk 为 24
      - name: Ensure Android Scaffold
        run: |
          # 强制生成，Flutter 会补齐缺失的 android 目录，不会覆盖你写好的 Dart 代码
          flutter create . --platforms android --project-name anime_aggregator --org com.example
          
          # 兼容旧版 Groovy 文件 (.gradle)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdk 24/minSdk = 24/g' android/app/build.gradle
            echo "Patched build.gradle"
          fi
          
          # 兼容新版 Kotlin 文件 (.gradle.kts) - 你的报错就是缺了这段
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            echo "Patched build.gradle.kts"
          fi

      - name: Decode keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
