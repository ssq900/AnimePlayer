name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Folder & Inject Mirrors
        run: |
          # 1. 备份配置 (如果存在)
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml AndroidManifest_backup.xml
          fi
          
          # 2. 彻底重建 Android 目录
          rm -rf android
          flutter create --platforms=android .
          
          # 3. 还原 Manifest (或者注入网络权限)
          if [ -f AndroidManifest_backup.xml ]; then
            cp AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          else
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
            sed -i 's#android:label="anime_aggregator"#android:label="anime_aggregator"\n        android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          fi
          rm -f AndroidManifest_backup.xml

          # 4. 核心修复：直接在 settings.gradle.kts 中注入阿里云镜像
          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              
              repositories {
                  maven { url = uri("https://maven.aliyun.com/repository/public") }
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          
          include(":app")
          EOF

      # ⚠️ 删掉了 Configure Gradle Mirror 步骤，直接用 settings.gradle.kts 里的配置

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (With Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
