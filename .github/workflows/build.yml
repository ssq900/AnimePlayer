name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Folder & Restore Customizations
        run: |
          # 1. 尝试备份，如果文件根本不存在则跳过（防止报错）
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml AndroidManifest_backup.xml
          fi
          if [ -f android/app/build.gradle ]; then
            cp android/app/build.gradle android_app_build_gradle_backup
          fi
          if [ -f android/app/build.gradle.kts ]; then
            cp android/app/build.gradle.kts android_app_build_gradle_kts_backup
          fi
          
          # 2. 彻底删除旧的残缺目录，重新生成
          rm -rf android
          flutter create --platforms=android .
          
          # 3. 还原配置（如果没有旧备份，就强行注入联网权限）
          if [ -f AndroidManifest_backup.xml ]; then
            cp AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          else
            # ⚠️ 核心注入：加上网络权限和允许 HTTP 明文请求
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
            sed -i 's#android:label="anime_aggregator"#android:label="anime_aggregator"\n        android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          fi
          
          # 4. 还原 build.gradle（如果有的话）
          if [ -f android_app_build_gradle_backup ]; then
            cp android_app_build_gradle_backup android/app/build.gradle
            rm -f android/app/build.gradle.kts
          elif [ -f android_app_build_gradle_kts_backup ]; then
            cp android_app_build_gradle_kts_backup android/app/build.gradle.kts
          fi
          
          # 清理临时文件
          rm -f AndroidManifest_backup.xml android_app_build_gradle_backup android_app_build_gradle_kts_backup

      - name: Configure Gradle Mirror
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      google()
                      mavenCentral()
                  }
              }
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (With Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
