name: anime_aggregator
description: XPath-driven anime aggregator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0 <3.36.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  gbk_codec: ^0.4.0
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  webdav_client: ^1.2.1
  file_picker: ^8.0.0+1
  synchronized: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
