name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'

      - name: Flutter pub get
        run: flutter pub get

      # 核心一步：如果发现没有 android 目录，自动生成并强制锁定 minSdk 24
      - name: Ensure Android Scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name anime_aggregator --org com.example
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdk 24/minSdk = 24/g' android/app/build.gradle
          fi

      # 如果你以后配置了 Secrets，自动签名
      - name: Decode keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
