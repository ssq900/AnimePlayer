name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Folder & Inject Mirrors
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml AndroidManifest_backup.xml
          fi
          
          rm -rf android
          flutter create --platforms=android .
          
          if [ -f AndroidManifest_backup.xml ]; then
            cp AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          else
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
            sed -i 's#android:label="anime_aggregator"#android:label="anime_aggregator"\n        android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          fi
          rm -f AndroidManifest_backup.xml

          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              
              repositories {
                  maven { url = uri("https://maven.aliyun.com/repository/public") }
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "9.1.1" apply false
              id("org.jetbrains.kotlin.android") version "2.4.10" apply false
          }
          
          include(":app")
          EOF

          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Inject Core Library Desugaring (Python)
        run: |
          python3 - << 'PYEOF'
          import re
          
          path = 'android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()

          if 'isCoreLibraryDesugaringEnabled' not in content:
              compile_options = """
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """
              content = re.sub(r'android\s*\{', 'android {\n' + compile_options, content, count=1)

          if 'desugar_jdk_libs' not in content:
              desugar_dep = """
              dependencies {
                  coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              }
              """
              content += '\n' + desugar_dep

          with open(path, 'w') as f:
              f.write(content)
          print("✅ build.gradle.kts 脱糖配置注入完成")
          PYEOF

      - name: Upgrade compileSdk to 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          echo "✅ 应用模块 compileSdk 已升级至 36"

      - name: Flutter pub get
        run: flutter pub get

      # 🔥 核心修复：提升 file_picker 插件的 compileSdk
      - name: Upgrade file_picker compileSdk to 36
        run: |
          find ~/.pub-cache/hosted/pub.dev -path "*file_picker*/android/build.gradle" -type f | while read -r file; do
            echo "Patching: $file"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$file"
          done
          echo "✅ file_picker 插件的 compileSdk 已升级"

      - name: Fix flutter_inappwebview ProGuard Compatibility
        run: |
          find ~/.pub-cache/hosted/pub.dev -path "*flutter_inappwebview*" -name "build.gradle" -type f | while read -r file; do
            echo "Patching: $file"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$file"
          done

      - name: Build APK (With Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
