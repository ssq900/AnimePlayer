name: anime_aggregator
description: XPath-driven anime aggregator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # 🔥 移除了 <3.36.0 的严格上限，允许获取新版 Flutter 的底层渲染性能优化
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ==================== 网络请求与解析 ====================
  http: ^1.2.2
  html: ^0.15.4                 
  xml: ^6.5.0                   
  gbk_codec: ^0.4.0             

  # ==================== 状态管理与本地存储 ====================
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  synchronized: ^3.1.0+1        
  webdav_client: ^1.2.1         

  # ==================== 网页抓取与嗅探 ====================
  # 🔥 解除锁死，使用 ^ 兼容最新补丁版本（修复潜在的 API 或安全漏洞）
  flutter_inappwebview: ^6.1.5   
  url_launcher: ^6.3.1
  file_picker: ^8.0.0+1
  
  # ==================== 播放器与手势控制 ====================
  # 🔥 解除锁死
  video_player: ^2.9.5           
  screen_brightness: ^2.0.0     
  volume_controller: ^3.3.0     
  share_plus: ^10.1.1           
  canvas_danmaku: ^0.3.4        # 高性能弹幕引擎

  # ==================== 进阶扩展功能 ====================
  flutter_local_notifications: ^18.0.1  
  speech_to_text: ^7.0.0                
  dlna_dart: ^0.1.2                     # 🔥 解除锁死

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4              

flutter:
  uses-material-design: true
